name: Build Windows release
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Test and build Windows release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Diagnose crash-safe loop test in isolation
        continue-on-error: true
        run: python -c "import sys,unittest; sys.path.insert(0,'tests'); s=unittest.defaultTestLoader.loadTestsFromName('test_game.FeatureTests.test_cli_and_crash_safe_loop'); r=unittest.TextTestRunner(verbosity=2).run(s); sys.exit(not r.wasSuccessful())"
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: Diagnose screen rendering test in isolation
        continue-on-error: true
        run: python -c "import sys,unittest; sys.path.insert(0,'tests'); s=unittest.defaultTestLoader.loadTestsFromName('test_game.FeatureTests.test_remaining_screens_draw'); r=unittest.TextTestRunner(verbosity=2).run(s); sys.exit(not r.wasSuccessful())"
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: Tests
        run: python -X faulthandler -m unittest discover -s tests -v
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: Soak test (bot plays every area type)
        run: python tools/soak_bot.py 600
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean tropy_eldorii.spec
      - name: Smoke-run the built exe (version flag)
        run: '& "dist/Tropy Eldorii/Tropy Eldorii.exe" --version'
      - name: Package portable version
        run: Compress-Archive -Path "dist/Tropy Eldorii" -DestinationPath Tropy_Eldorii_v35_win64_portable.zip
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\tropy_eldorii.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Tropy_Eldorii_v35_win64
          path: |
            Tropy_Eldorii_v35_win64_portable.zip
            dist/TropyEldorii_Setup_v35.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Tropy_Eldorii_v35_win64_portable.zip
            dist/TropyEldorii_Setup_v35.exe
